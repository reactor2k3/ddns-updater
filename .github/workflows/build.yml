name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check provider schema
        run: |
          node scripts/sync-ui.cjs
          git diff --exit-code -- internal/control/catalog.json
      - name: Check browser scripts
        run: |
          for file in internal/server/web/*.js internal/auth/ui/*.js; do node --check "$file"; done
      - name: Tests with race detector
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Validate Compose and build production image
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.host.yaml config --quiet
          docker compose -f compose.build.yaml config --quiet
          docker build -t ddns-smoke .
      - name: First-start and restart smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs ddns-smoke; docker rm -f ddns-smoke; docker rm -f ddns-lan-smoke 2>/dev/null || true' EXIT
          docker run -d --name ddns-smoke -p 127.0.0.1:18000:8000 -e AUTH_ORIGIN=http://localhost:8000 ddns-smoke
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:8000' http://127.0.0.1:18000/api/entries || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          test "$status" = 401
          docker run -d --name ddns-lan-smoke -p 127.0.0.1:18001:8000 -e AUTH_ORIGIN=http://192.168.1.100:18001 ddns-smoke
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 192.168.1.100:18001' http://127.0.0.1:18001/api/entries || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          test "$status" = 401
          curl -fsS -H 'Host: 192.168.1.100:18001' http://127.0.0.1:18001/api/auth/state | node -e 'let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{const s=JSON.parse(raw);if(s.insecureHTTP!==true||s.passkeysAvailable!==false)process.exit(1)})'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:8000' http://127.0.0.1:18000/setup)" = 200
          docker restart ddns-smoke
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:8000' http://127.0.0.1:18000/api/entries || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 1
          done
          test "$status" = 401
  publish:
    if: github.event_name == 'release' && github.repository_owner == 'reactor2k3'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate optional Docker Hub destination
        if: vars.DOCKERHUB_ENABLED == 'true'
        env:
          HUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$HUB_USERNAME"
          [[ "$HUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_.-]*$ ]]
      - name: Sign in to Docker Hub only when explicitly enabled
        if: vars.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        # Docker Hub stays disabled unless explicitly enabled in repository variables.
        id: metadata
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_ENABLED == 'true' && vars.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
